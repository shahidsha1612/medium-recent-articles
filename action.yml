name: "Medium Recent Articles"
description: "Updates a README.md file with a Markdown list of your recent Medium articles, pulled from Medium's public RSS feed."
author: "you"
inputs:
  username:
    description: "Medium username (with or without @), or a full custom RSS feed URL for a custom domain."
    required: true
  count:
    description: "Number of recent articles to include."
    required: false
    default: "3"
  readme:
    description: "Path to the README file to update."
    required: false
    default: "README.md"
runs:
  using: "node20"
  main: "index.js"
